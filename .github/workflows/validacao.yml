name: Validacao

on:
  push:
    branches:
      - refatoracao
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build:web

      - name: Build backend
        run: npm run build:api

      - name: Testes backend
        run: npm run test --workspace=api -- --runInBand

      - name: Testes frontend
        run: npm run test:web
