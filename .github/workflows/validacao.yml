name: Validacao

on:
  push:
    branches:
      - refatoracao
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kanban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kanban_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanban_test?schema=public
      JWT_SECRET: chave-ci-mini-kanban
      FRONTEND_URL: http://localhost:4173
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_SECURE: "false"
      MAIL_USER: teste
      MAIL_PASS: teste
      MAIL_FROM: teste@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build:web

      - name: Build backend
        run: npm run build:api

      - name: Testes backend
        run: npm run test --workspace=api -- --runInBand

      - name: Testes frontend
        run: npm run test:web

      - name: Aplicar migrations
        run: cd api && npx prisma migrate deploy

      - name: Subir API
        run: |
          npm run start:prod --workspace=api > /tmp/mini-kanban-api.log 2>&1 &
          echo $! > /tmp/mini-kanban-api.pid
          for tentativa in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/docs > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mini-kanban-api.log
          exit 1

      - name: Confirmar protecao das tarefas
        run: |
          codigo=$(curl --silent --output /tmp/resposta.txt --write-out "%{http_code}" http://127.0.0.1:3000/api/tasks)
          cat /tmp/resposta.txt
          test "$codigo" = "401"

      - name: Validar fluxo autenticado
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:3000/api

          curl --fail --silent -X POST "$BASE/auth/register" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Usuario CI","email":"usuario-ci@example.com","password":"senha123"}' > /tmp/usuario1.json

          curl --fail --silent -X POST "$BASE/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"usuario-ci@example.com","password":"senha123"}' > /tmp/login1.json
          TOKEN1=$(node -e "const x=require('/tmp/login1.json'); if(!x.accessToken) process.exit(1); process.stdout.write(x.accessToken)")

          curl --fail --silent "$BASE/users/me" -H "Authorization: Bearer $TOKEN1" > /tmp/perfil.json
          node -e "const x=require('/tmp/perfil.json'); if(x.email!=='usuario-ci@example.com'||x.password||x.passwordResetToken||x.passwordResetExpires) process.exit(1)"

          curl --fail --silent -X POST "$BASE/tasks" \
            -H "Authorization: Bearer $TOKEN1" \
            -H 'Content-Type: application/json' \
            -d '{"title":"Tarefa CI","description":"Fluxo de validacao","status":"TODO","priority":"Média","cardStyle":"SPIRAL","tags":["ci"],"position":1}' > /tmp/tarefa.json
          TAREFA_ID=$(node -e "const x=require('/tmp/tarefa.json'); if(!x.id) process.exit(1); process.stdout.write(x.id)")

          curl --fail --silent "$BASE/tasks" -H "Authorization: Bearer $TOKEN1" > /tmp/tarefas.json
          TAREFA_ID="$TAREFA_ID" node -e "const x=require('/tmp/tarefas.json'); if(!Array.isArray(x)||!x.some(t=>t.id===process.env.TAREFA_ID&&t.title==='Tarefa CI')) process.exit(1)"

          curl --fail --silent -X PATCH "$BASE/tasks/$TAREFA_ID" \
            -H "Authorization: Bearer $TOKEN1" \
            -H 'Content-Type: application/json' \
            -d '{"status":"DOING","title":"Tarefa CI atualizada"}' > /tmp/tarefa-atualizada.json
          node -e "const x=require('/tmp/tarefa-atualizada.json'); if(x.status!=='DOING'||x.title!=='Tarefa CI atualizada') process.exit(1)"

          curl --fail --silent -X POST "$BASE/tasks/$TAREFA_ID/comments" \
            -H "Authorization: Bearer $TOKEN1" \
            -H 'Content-Type: application/json' \
            -d '{"content":"Comentario CI"}' > /tmp/comentario.json
          COMENTARIO_ID=$(node -e "const x=require('/tmp/comentario.json'); if(!x.id) process.exit(1); process.stdout.write(x.id)")

          curl --fail --silent "$BASE/tasks/$TAREFA_ID/comments" -H "Authorization: Bearer $TOKEN1" > /tmp/comentarios.json
          node -e "const x=require('/tmp/comentarios.json'); if(!Array.isArray(x)||!x.some(c=>c.content==='Comentario CI')) process.exit(1)"

          curl --fail --silent -X PATCH "$BASE/users/me" \
            -H "Authorization: Bearer $TOKEN1" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Usuario CI Atualizado"}' > /tmp/perfil-atualizado.json
          node -e "const x=require('/tmp/perfil-atualizado.json'); if(x.name!=='Usuario CI Atualizado'||x.password) process.exit(1)"

          curl --fail --silent -X POST "$BASE/auth/register" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Outro Usuario","email":"outro-ci@example.com","password":"senha123"}' > /tmp/usuario2.json
          curl --fail --silent -X POST "$BASE/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"outro-ci@example.com","password":"senha123"}' > /tmp/login2.json
          TOKEN2=$(node -e "const x=require('/tmp/login2.json'); if(!x.accessToken) process.exit(1); process.stdout.write(x.accessToken)")

          codigo=$(curl --silent --output /tmp/sem-permissao.txt --write-out "%{http_code}" -X PATCH "$BASE/tasks/$TAREFA_ID" \
            -H "Authorization: Bearer $TOKEN2" \
            -H 'Content-Type: application/json' \
            -d '{"title":"Nao pode alterar"}')
          test "$codigo" = "403"

          codigo=$(curl --silent --output /tmp/comentarios-sem-acesso.txt --write-out "%{http_code}" "$BASE/tasks/$TAREFA_ID/comments" \
            -H "Authorization: Bearer $TOKEN2")
          test "$codigo" = "404"

          curl --fail --silent -X DELETE "$BASE/comments/$COMENTARIO_ID" -H "Authorization: Bearer $TOKEN1" > /dev/null
          codigo=$(curl --silent --output /tmp/tarefa-removida.txt --write-out "%{http_code}" -X DELETE "$BASE/tasks/$TAREFA_ID" -H "Authorization: Bearer $TOKEN1")
          test "$codigo" = "204"

          curl --fail --silent "$BASE/tasks" -H "Authorization: Bearer $TOKEN1" > /tmp/tarefas-finais.json
          node -e "const x=require('/tmp/tarefas-finais.json'); if(!Array.isArray(x)||x.length!==0) process.exit(1)"

      - name: Encerrar API
        if: always()
        run: |
          if [ -f /tmp/mini-kanban-api.pid ]; then
            kill "$(cat /tmp/mini-kanban-api.pid)" || true
          fi

  docker:
    runs-on: ubuntu-latest
    needs: validar
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kanban_docker
      JWT_SECRET: chave-ci-docker-mini-kanban
      FRONTEND_URL: http://localhost:8080
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_SECURE: "false"
      MAIL_USER: teste
      MAIL_PASS: teste
      MAIL_FROM: teste@example.com
      BASE_URL: http://127.0.0.1:8080
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar Compose
        run: docker compose config > /dev/null

      - name: Construir imagens
        run: docker compose build

      - name: Subir containers
        run: docker compose up -d

      - name: Aguardar aplicacao
        run: |
          set -euo pipefail
          for tentativa in {1..30}; do
            api_ok=0
            web_ok=0
            curl --fail --silent http://127.0.0.1:3000/api/docs > /dev/null && api_ok=1 || true
            curl --fail --silent http://127.0.0.1:8080 > /dev/null && web_ok=1 || true
            if [ "$api_ok" = "1" ] && [ "$web_ok" = "1" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Validar containers e proxy
        run: |
          set -euo pipefail
          docker compose ps
          curl --fail --silent http://127.0.0.1:8080 | grep -q '<div id="root"></div>'
          codigo_api=$(curl --silent --output /tmp/api-direta.txt --write-out "%{http_code}" http://127.0.0.1:3000/api/tasks)
          test "$codigo_api" = "401"
          codigo_proxy=$(curl --silent --output /tmp/api-proxy.txt --write-out "%{http_code}" http://127.0.0.1:8080/api/tasks)
          test "$codigo_proxy" = "401"

      - name: Instalar dependencias do navegador
        run: npm install --no-audit --no-fund

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Validar interface no navegador
        run: npm run test:e2e --workspace=web -- --reporter=line,html

      - name: Publicar capturas e relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao-visual-mini-kanban
          path: |
            web/artifacts/browser
            web/playwright-report
            web/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Encerrar containers
        if: always()
        run: docker compose down -v
