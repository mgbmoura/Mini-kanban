version: '3.8'

services:
  kanban_db:
    image: postgres:17
    container_name: kanban_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kanban_network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: kanban_api
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - /app/node_modules
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - kanban_db
    command: /bin/sh -c "sleep 10 && npx prisma migrate deploy && npm run start:dev"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kanban_network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: kanban_web
    restart: always
    ports:
      - "5173:5173"

    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - api
    command: ["npm", "run", "dev", "--", "--host"]
    networks:
      - kanban_network

networks:
  kanban_network:
    driver: bridge

volumes:
  db_data:
